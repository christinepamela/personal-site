<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ruang Home Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: step index on the left, a phone-sized planner in the middle, notes on the right. Drafting-grid ground, teal ink. */
:root{
  --bg:#edf2f1; --surface:#fbfdfc; --ink:#1b2b2a; --muted:#566b68; --line:#c3d2cf;
  --accent:#0b6e63; --accent-ink:#ffffff; --accent-soft:#d6ebe7;
  --ok:#2c7a4b; --warn:#a8650f; --bad:#b4325a;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1918; --surface:#172524; --ink:#e3eeec; --muted:#8fa7a3; --line:#2b4240;
  --accent:#4cc4b0; --accent-ink:#06261f; --accent-soft:#1d3b37;
  --ok:#6fcf97; --warn:#e6b25a; --bad:#f08aa8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1918; --surface:#172524; --ink:#e3eeec; --muted:#8fa7a3; --line:#2b4240;
  --accent:#4cc4b0; --accent-ink:#06261f; --accent-soft:#1d3b37;
  --ok:#6fcf97; --warn:#e6b25a; --bad:#f08aa8; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;
  padding-inline:16px;padding-block:20px 40px;
  background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin-inline:auto}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin-bottom:20px}
header.top h1{font-family:var(--display);font-size:28px;line-height:1.1;margin:0;font-weight:700;letter-spacing:-.01em}
header.top p{margin:0;color:var(--muted);max-width:62ch}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;grid-template-columns:200px minmax(0,400px) minmax(0,1fr);gap:28px;align-items:start}
nav.steps{display:flex;flex-direction:column;gap:2px;position:sticky;top:16px}
nav.steps button{display:flex;gap:10px;align-items:baseline;text-align:left;background:none;border:0;border-left:2px solid var(--line);padding:9px 12px;color:var(--muted)}
nav.steps button .n{font-family:var(--mono);font-size:11px}
nav.steps button[aria-current="step"]{border-left-color:var(--accent);color:var(--ink);background:var(--accent-soft);font-weight:600}
.phone{background:var(--surface);border:1.5px solid var(--ink);border-radius:30px;overflow:hidden;display:flex;flex-direction:column;width:100%;max-width:400px;box-shadow:8px 8px 0 var(--line)}
.phone-head{padding:16px 18px 10px;border-bottom:1px solid var(--line)}
.phone-head h2{font-family:var(--display);font-size:22px;line-height:1.15;margin:2px 0 0;font-weight:700;text-wrap:balance}
.screen{height:620px;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:16px}
.phone-foot{display:flex;gap:10px;padding:12px 18px;border-top:1px solid var(--line)}
.btn{border:1.5px solid var(--ink);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600}
.btn.small{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.phone-foot .btn.primary{flex:1}
.btn:disabled{opacity:.4;cursor:default}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:13px}
.hint{font-weight:400;color:var(--muted);font-size:12px;margin:0}
input[type=text],input[type=number],input[type=url],select{font:inherit;padding:9px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%;min-width:0}
.row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:none;border-radius:999px;padding:5px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sec{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.slots{display:grid;gap:10px}
.slotw{display:flex;gap:8px;align-items:center}
.slot{display:flex;flex:1;gap:12px;align-items:center;border:1.5px dashed var(--muted);border-radius:12px;padding:10px;cursor:pointer;min-width:0}
.slot:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.slot input{position:absolute;opacity:0;width:1px;height:1px}
.slot .ph{width:64px;height:64px;border-radius:8px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:10px;color:var(--muted);flex:none;overflow:hidden}
.slot .ph img{width:100%;height:100%;object-fit:cover}
.slot b{display:block}
.compass{display:grid;grid-template-columns:repeat(3,56px);grid-auto-rows:44px;gap:6px;justify-content:center}
.compass .mid{display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:8px}
.box{border:1.5px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.box.ok{border-color:var(--ok)} .box.warn{border-color:var(--warn)} .box.bad{border-color:var(--bad)}
.box ul{margin:0;padding-left:18px}
.pill{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;border:1px solid currentColor;border-radius:999px;padding:1px 8px;white-space:nowrap;align-self:flex-start}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)}
.season{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;font-family:var(--mono);font-size:9px;text-align:center}
.season span{padding:6px 0;border-radius:3px;background:var(--bg)}
.season .ne{background:var(--accent-soft)} .season .sw{background:var(--accent);color:var(--accent-ink)} .season .im{background:var(--line)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{border:1.5px solid var(--line);border-radius:14px;background:none;padding:8px;display:flex;flex-direction:column;gap:8px;text-align:left}
.pick:hover{border-color:var(--accent)}
.sw{display:grid;grid-template-columns:repeat(3,1fr);height:84px;border-radius:8px;overflow:hidden}
.prog{display:flex;gap:4px} .prog i{flex:1;height:4px;border-radius:2px;background:var(--line)} .prog i.on{background:var(--accent)}
.card{border:1.5px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;text-align:left;background:none;width:100%}
.card[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pal{display:flex;height:26px;border-radius:6px;overflow:hidden}.pal.s{height:14px;width:120px}.pal i{flex:1}
.card h3,.box h3{font-family:var(--display);font-size:17px;margin:0;line-height:1.2}
.split{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.items{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.item small{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.bar{height:12px;border-radius:6px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)} .bar i.over{background:var(--bad)}
.gal{display:grid;gap:12px}
.ins{border:1.5px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.ins img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.ins .b{padding:10px;display:flex;flex-direction:column;gap:8px}
.site{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.site div{min-width:0;overflow-wrap:anywhere}
aside.notes{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
aside.notes h3{font-family:var(--display);font-size:20px;margin:0}
aside.notes ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
aside.notes p{margin:0;max-width:62ch}
@media (max-width:1020px){
  .grid{grid-template-columns:minmax(0,1fr)}
  nav.steps{flex-direction:row;overflow-x:auto;position:static;padding-bottom:4px}
  nav.steps button{border-left:0;border-bottom:2px solid var(--line);white-space:nowrap}
  nav.steps button[aria-current="step"]{border-bottom-color:var(--accent)}
  .phone{margin-inline:auto}
}
@media (max-width:420px){.compass{grid-template-columns:repeat(3,52px)} .screen{height:min(72vh,620px)}}
@media (prefers-reduced-motion:no-preference){.screen>*{animation:in .25s ease both}@keyframes in{from{opacity:.4;transform:translateY(4px)}}}
</style>

<div class="wrap">
  <header class="top">
    <h1>Ruang Home Planner</h1>
    <p>Upload a photo or floor plan, set the climate, find your taste and get three designs with shops in Klang Valley, the Peninsula or Borneo.</p>
    <span class="tag" id="status">Loading…</span>
  </header>
  <div class="grid">
    <nav class="steps" id="nav" aria-label="Screens"></nav>
    <div class="phone">
      <div class="phone-head"><div class="tag" id="stepTag"></div><h2 id="title"></h2></div>
      <div class="screen" id="screen" aria-live="polite"></div>
      <div class="phone-foot"><button class="btn" id="back">Back</button><button class="btn primary" id="next">Next</button></div>
    </div>
    <aside class="notes" id="notes"></aside>
  </div>
</div>

<script>
const STEPS=[
 {t:'Your home',s:'Home',collect:['Property type and home age','Budget in RM','Rooms to remodel','Known problems (damp, wiring, leaks, termites)','Where you will shop'],why:'The order of work depends on the home. Damp walls or old wiring must be fixed before paint and lights, so the planner asks first.'},
 {t:'Show us the space',s:'Capture',collect:['Photo of the hall','Photo of one wall','Floor plan or blueprint image','Sizes and condition read from your images'],why:'Photos show style and condition. A plan gives true sizes. Claude reads the plan and photos, then you confirm before anything is used.'},
 {t:'Room and climate',s:'Climate',collect:['Hall length, width and ceiling height','Which sides have windows or doors','Wind and humidity pattern','Afternoon sun direction'],why:'Heat and humidity decide materials, colours and layout. Openings on the same wind axis as the monsoons let the house breathe, which cuts mould and cooling cost.'},
 {t:'Your taste',s:'Taste',collect:['Four quick either/or choices','A style profile that feeds the designs'],why:'Four fast choices beat a long form. Each choice nudges a style score that the designs start from.'},
 {t:'Inspiration',s:'Inspire',collect:['Images that inspire you','Shops and websites you like, with notes','Claude\'s check of each image against your room size, light and humidity'],why:'You can keep adding images and sources as you find them. Each image is checked against your hall, so you learn what works before you buy.'},
 {t:'Design options',s:'Designs',collect:['Three options: starter or tailored','Palette, materials and furniture sizes','Estimated cost against budget'],why:'Starter options come from your taste. Tailoring uses your sizes, climate, inspiration and saved shops. Prices are rough estimates.'},
 {t:'Where to buy',s:'Shop',collect:['Items, sizes, estimated price and source','Region: Klang Valley, Peninsula, Borneo','Products you found yourself, with sizes'],why:'Prices and freight differ by region. Add products you find, with their size, and the fit check will test them against your room.'},
 {t:'Budget and fit check',s:'Check',collect:['Total against budget','Walkway and wall clearances','Ceiling height for fans','Ventilation, damp, delivery and inspiration warnings'],why:'This screen stops expensive mistakes: a sofa that blocks the walkway, a fan on a low ceiling, or paint over a damp wall.'}
];
const DIRS=['NW','N','NE','W','C','E','SW','S','SE'];
const OPP={N:'S',S:'N',E:'W',W:'E',NE:'SW',SW:'NE',NW:'SE',SE:'NW'};
const REG={kv:'Klang Valley',pen:'Peninsula',bor:'Borneo'};
const ROLES=['sofa','console','tile','paint','fan','blinds','dehumidifier','other'];
const QUIZ=[
 {q:'Which materials feel more like home?',o:[{l:'Light oak and rattan',c:['#d9c3a0','#b8975f','#ece3d2'],p:{A:2,B:1}},{l:'Dark teak and brass',c:['#4a2e22','#8a5a3a','#c9a24a'],p:{C:2}}]},
 {q:'Pick a colour mood.',o:[{l:'Soft white, sage, sand',c:['#f1efe8','#a9b79a','#d8cdb4'],p:{A:1,B:2}},{l:'Deep teal, red, gold',c:['#0f5c5c','#b8412e','#e3b866'],p:{C:2}}]},
 {q:'How should the hall feel?',o:[{l:'Open and airy, few things',c:['#ffffff','#e6ebec','#c9d1d3'],p:{B:2,A:1}},{l:'Layered, collected, patterned',c:['#7a3b2e','#2d6a6a','#e9d7b0'],p:{C:2}}]},
 {q:'Which floor would you walk on?',o:[{l:'Wood-look tile, plain',c:['#cdb592','#bfa57f','#d8c4a4'],p:{A:2,B:1}},{l:'Patterned cement tile',c:['#1f6a6a','#e8dcc2','#b8412e'],p:{C:2}}]}
];
const ITEMS=[
 {n:'Wood-look porcelain tile, hall, laid',sp:'About 35 m²',role:'tile',w:null,dp:null,p:{kv:4200,pen:3900,bor:4600},s:{kv:'Tile showrooms, Klang Valley',pen:'Tile traders, Johor Bahru',bor:'Kuching tile wholesalers'}},
 {n:'Mould-resistant interior paint',sp:'2 × 18 L, low-VOC',role:'paint',w:null,dp:null,p:{kv:1100,pen:1050,bor:1200},s:{kv:'Paint dealers, Klang Valley',pen:'Paint dealers, Penang',bor:'Paint dealers, Kuching'}},
 {n:'3-seater sofa, washable fabric',sp:'2.1 m wide, 0.95 m deep',role:'sofa',w:2.1,dp:0.95,p:{kv:2400,pen:2100,bor:2600},s:{kv:'Furniture stores, Klang Valley',pen:'Muar furniture makers',bor:'Kuching workshops'}},
 {n:'Rattan and timber TV console',sp:'1.8 m wide, 0.45 m deep',role:'console',w:1.8,dp:0.45,p:{kv:1300,pen:1100,bor:1000},s:{kv:'Klang Valley furniture shops',pen:'Muar furniture makers',bor:'Sarawak rattan and belian craftsmen'}},
 {n:'DC ceiling fan with light',sp:'52 inch, quiet motor',role:'fan',w:null,dp:null,p:{kv:650,pen:620,bor:720},s:{kv:'Hardware and lighting shops',pen:'Electrical shops, Ipoh',bor:'Electrical shops, Kota Kinabalu'}},
 {n:'Bamboo roller blinds, west windows',sp:'2 pieces',role:'blinds',w:null,dp:null,p:{kv:320,pen:300,bor:240},s:{kv:'Online and home stores',pen:'Local blind makers',bor:'Local weavers, Sarawak and Sabah'}},
 {n:'Dehumidifier',sp:'20 L per day',role:'dehumidifier',w:null,dp:null,p:{kv:900,pen:880,bor:980},s:{kv:'Appliance stores',pen:'Appliance stores',bor:'Appliance stores'}}
];
const OPTS={
 A:{n:'Tropical Japandi',cost:38000,pal:['#e7dfcf','#a9b79a','#7a5a42','#2d3b36'],d:'Light oak, rattan and linen on sage walls. Low furniture, bare floor, lots of air.',fit:[['ok','Rattan and oak handle humidity'],['ok','Open layout keeps wind moving']],items:ITEMS},
 B:{n:'Bright Modern Minimal',cost:32000,pal:['#f4f6f7','#c9d1d3','#3f4a4f','#d9a441'],d:'White walls, porcelain floor and sealed built-in storage. Clean lines, easy to wipe down.',fit:[['ok','Sealed surfaces resist mould'],['warn','Plain white shows stains fast']],items:ITEMS},
 C:{n:'Peranakan Layered',cost:45000,pal:['#0f5c5c','#b8412e','#e3b866','#efe3cc'],d:'Patterned cement tiles, carved teak and deep teal. Rich and collected.',fit:[['ok','Cement tile stays cool underfoot'],['warn','Dark walls run hot in a west-facing hall']],items:ITEMS}
};
const KEYS=['name','prop','age','budget','scope','issues','L','W','H','open','quiz','opt','region','designs','planRead','photoRead'];
const S={step:0,name:'My home',prop:'Terrace house',age:'10 to 20 years',budget:50000,scope:['Hall'],issues:[],L:5.2,W:3.8,H:2.8,open:['E','W'],quiz:[null,null,null,null],opt:'A',region:'kv',
  designs:null,planRead:null,photoRead:null,photos:{hall:null,wall:null,plan:null},inspo:[],shops:[],finds:[],err:'',dirty:false};
const AI={key:null,ctl:null};
const ST={db:null,pdoc:null,ok:false,ro:false,loaded:false,state:''};
let SMP=null,IMGOK=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rm=n=>'RM '+Math.round(n).toLocaleString('en-MY');
const use=n=>{try{return window.claude&&window.claude.use?window.claude.use(n):Promise.resolve(null)}catch(e){return Promise.resolve(null)}};
const num=v=>typeof v==='number'&&isFinite(v)&&v>0&&v<1000?Math.round(v*100)/100:null;
const str=v=>typeof v==='string'?v.slice(0,300):'';
const arr=(a,k)=>(Array.isArray(a)?a:[]).slice(0,k).map(str).filter(Boolean);
const hex=v=>typeof v==='string'&&/^#[0-9a-f]{6}$/i.test(v);
const design=k=>(S.designs&&S.designs[k])||OPTS[k];
const items=()=>design(S.opt).items;
const chip=(k,v)=>`<button class="chip" data-act="toggle" data-k="${k}" data-v="${esc(v)}" aria-pressed="${S[k].includes(v)}">${esc(v)}</button>`;
function scores(){const t={A:0,B:0,C:0};S.quiz.forEach((a,i)=>{if(a!==null){const p=QUIZ[i].o[a].p;for(const k in p)t[k]+=p[k]}});return t}
function topStyle(){const t=scores();return Object.keys(t).sort((a,b)=>t[b]-t[a])[0]}
function vent(){
  const o=S.open,sun=['W','SW','NW'].some(d=>o.includes(d));let lv='warn',tx;
  if(!o.length)tx='Select every side that has a window or door that opens.';
  else if(o.includes('NE')&&o.includes('SW')){lv='ok';tx='Openings sit on the NE to SW wind axis. Air can cross the hall in both monsoon seasons.'}
  else if(o.some(d=>o.includes(OPP[d]))){lv='ok';tx='Openings face each other, so air can cross. They are off the main monsoon axis, so flow will be weaker in some months.'}
  else tx='No opposite openings, so air will not cross. Plan a ceiling fan and a vent or louvre on the far wall.';
  return{lv,tx,sun};
}
function roleItem(r){return items().find(i=>i.role===r)}
function fits(){
  const v=vent(),r=[],sofa=roleItem('sofa'),con=roleItem('console');
  const sw=(sofa&&sofa.w)||2.1,sd=(sofa&&sofa.dp)||0.95,cd=(con&&con.dp)||0.45;
  const walk=S.W-sd-cd,rem=S.L-sw;
  r.push([walk>=0.9?'ok':'warn',`Walkway between sofa and console is ${walk.toFixed(2)} m. You need at least 0.90 m.`]);
  r.push([rem>=0.6?'ok':'warn',`The ${sw} m sofa leaves ${rem.toFixed(2)} m on the long wall for a side table.`]);
  r.push([S.H>=2.6?'ok':'warn',`Ceiling is ${S.H.toFixed(1)} m. A 52 inch fan needs about 2.6 m to hang safely.`]);
  r.push([v.lv,v.tx]);
  S.finds.filter(f=>f.w).forEach(f=>{const left=S.L-f.w;r.push([left>=0.3?'ok':'warn',`Your find "${f.name}" is ${f.w} m wide. The long wall is ${S.L} m, so ${left.toFixed(2)} m remains.`])});
  S.inspo.filter(i=>i.analysis&&i.analysis.verdict==='poor').slice(0,3).forEach(i=>r.push(['warn',`Inspiration image "${i.analysis.style||'saved image'}" is a poor fit: ${i.analysis.reasons[0]||'see the Inspiration screen'}.`]));
  if(S.issues.includes('Damp walls'))r.push(['warn','Damp walls reported. Find and fix the source before painting, because mould-resistant paint will not stop a leak.']);
  if(S.issues.includes('Old wiring'))r.push(['warn','Old wiring reported. Have a licensed electrician check it before adding fans and lights.']);
  if(S.photoRead&&S.photoRead.issues.length)r.push(['warn','Your photos show possible issues: '+S.photoRead.issues.join('; ')+'. This is from the images only, so have it checked on site.']);
  if(S.region==='bor')r.push(['warn','Borneo sourcing: sea freight adds time. Order early and confirm lead times (estimate 2 to 3 weeks).']);
  if(!S.photos.plan)r.push(['warn','No floor plan uploaded yet, so all sizes are manual. Add the plan on the Capture screen.']);
  return r;
}
/* ---------- storage ---------- */
function setStatus(){
  let t;
  if(!ST.loaded)t='Loading…';
  else if(ST.ok&&!ST.ro)t=ST.state==='saving'?'Saving…':ST.state==='error'?'Could not save. Try again':'Saved to your account';
  else t='Not saved: changes last until you close this page';
  $('status').textContent=t;
}
function projectData(){const d={};KEYS.forEach(k=>{if(S[k]!==undefined)d[k]=S[k]});d.ts=Date.now();return d}
let saveT=null,saving=false,again=false;
function queueSave(){S.dirty=true;if(!ST.ok||ST.ro)return setStatus();clearTimeout(saveT);ST.state='saving';setStatus();saveT=setTimeout(flush,700)}
async function flush(){
  if(saving){again=true;return}
  saving=true;
  try{await ST.pdoc.set(projectData());ST.state='saved'}
  catch(e){if(e&&e.code==='invalid_argument')ST.ro=true;ST.state='error'}

}

function shrink(file,tries){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{URL.revokeObjectURL(url);let out='';
      for(const [mx,q] of tries){const k=Math.min(1,mx/Math.max(img.width,img.height)),c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(img.width*k));c.height=Math.max(1,Math.round(img.height*k));
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);if(out.length<190000)break}
      out.length<190000?res(out):rej(new Error('large'))};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('type'))};
    img.src=url;
  });
}

 const fd=S.finds.map(f=>`<div class="item"><b>${esc(f.name)}</b><span class="mono">${f.price?rm(f.price):'No price'}</span><small>${f.w?f.w+(f.d?' × '+f.d:'')+' m · ':''}${f.url?`<a href="${esc(f.url)}" target="_blank" rel="noopener noreferrer">${esc(f.host||'Link')}</a>`:'Added by you'} · <button class="btn small" data-act="delfind" data-id="${esc(f.id)}">Remove</button></small></div>`).join('');
 return`<p class="hint">Shopping list for <b>${esc(design(S.opt).n)}</b>. Prices and sources are estimates until you confirm them in store or online.</p>
 <div class="chips">${Object.keys(REG).map(k=>`<button class="chip" data-act="set" data-k="region" data-v="${k}" aria-pressed="${S.region===k}">${REG[k]}</button>`).join('')}</div>
 <div class="items">${its.map(i=>`<div class="item"><b>${esc(i.n)}</b><span class="mono">${rm(i.p[S.region])}</span><small>${esc(i.sp)}${i.s[S.region]?' · '+esc(i.s[S.region]):''}</small></div>`).join('')}${fd}</div>
 <div class="split"><b>Total listed</b><b class="mono">${rm(t)}</b></div>
 ${S.region==='bor'?'<div class="box warn"><span class="pill warn">Freight</span><span>Sea freight to or from Borneo adds cost and 2 to 3 weeks. Local rattan and belian are cheaper at source.</span></div>':''}
 ${S.shops.length?`<div><p class="sec">Your saved sites</p><div class="chips" style="margin-top:8px">${S.shops.map(s=>`<a class="chip" style="text-decoration:none;color:var(--ink)" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.name)}</a>`).join('')}</div></div>`:''}
 <div><p class="sec">Add a product you found</p>${errBox()}
 <form data-form="find" style="display:flex;flex-direction:column;gap:8px;margin-top:8px">
  <input type="text" id="fn" placeholder="Product name" aria-label="Product name">
  <div class="row"><input type="number" id="fp" min="0" step="1" placeholder="Price RM" aria-label="Price in RM"><input type="number" id="fw" min="0" step="0.01" placeholder="Width m" aria-label="Width in metres"><input type="number" id="fd" min="0" step="0.01" placeholder="Depth m" aria-label="Depth in metres"></div>
  <input type="url" id="fl" placeholder="Link (optional)" aria-label="Product link">
  <button class="btn small" type="submit" style="align-self:flex-start">Add product</button></form>
  <p class="hint" style="margin-top:6px">Products with a width are tested against your hall on the fit check.</p></div>`},
7(){const o=design(S.opt),pct=o.cost/S.budget*100,over=o.cost>S.budget,its=items(),t=its.reduce((a,i)=>a+i.p[S.region],0)+S.finds.reduce((a,f)=>a+(f.price||0),0);
 return`<div><div class="split"><b>${esc(o.n)}</b><span class="mono">${rm(o.cost)} of ${rm(S.budget)}</span></div><div class="bar" style="margin-top:6px"><i class="${over?'over':''}" style="width:${Math.min(100,pct||0)}%"></i></div>
 <p class="hint" style="margin-top:6px">${over?`Over budget by ${rm(o.cost-S.budget)}.`:`${rm(S.budget-o.cost)} left. Items listed (${REG[S.region]}): ${rm(t)}.`}</p></div>
 <p class="sec">Fit check</p>${fits().map(f=>`<div class="box ${f[0]}"><span class="pill ${f[0]}">${f[0]==='ok'?'OK':'Warning'}</span><span>${esc(f[1])}</span></div>`).join('')}`}
};
let lastStep=-1;
function render(){
  const keep=S.step===lastStep?$('screen').scrollTop:0;
  $('nav').innerHTML=STEPS.map((s,i)=>`<button data-act="go" data-i="${i}" ${i===S.step?'aria-current="step"':''}><span class="n">${i+1}</span>${s.s}</button>`).join('');
  $('stepTag').textContent=`Screen ${S.step+1} of ${STEPS.length}`;
  $('title').textContent=STEPS[S.step].t;
  $('screen').innerHTML=V[S.step]();
  $('screen').scrollTop=keep;lastStep=S.step;
  $('back').disabled=S.step===0;
  $('next').textContent=S.step===STEPS.length-1?'Back to start':'Next';
  const s=STEPS[S.step];
  $('notes').innerHTML=`<span class="tag">What this screen collects</span><h3>${s.t}</h3><ul>${s.collect.map(c=>`<li>${c}</li>`).join('')}</ul><span class="tag">Why it matters</span><p>${s.why}</p>`;
}
/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;let save=false;
  if(a==='go'){S.step=+b.dataset.i;S.err=''}
  else if(a==='toggle'){const k=b.dataset.k,v=b.dataset.v,i=S[k].indexOf(v);i<0?S[k].push(v):S[k].splice(i,1);save=true}
  else if(a==='set'){S[b.dataset.k]=b.dataset.v;save=true}
  else if(a==='pick'){S.quiz[+b.dataset.i]=+b.dataset.j;save=true}
  else if(a==='redo'){S.quiz=[null,null,null,null];save=true}
  else if(a==='stop'){if(AI.ctl)AI.ctl.abort();return}
  else if(a==='readplan'){aiRun('plan',readPlan);return}
  else if(a==='readphotos'){aiRun('photos',readPhotos);return}
  else if(a==='check'){const id=b.dataset.id;aiRun('inspo:'+id,s=>checkInspo(id,s));return}
  else if(a==='tailor'){aiRun('design',tailor);return}
  else if(a==='resetdesigns'){S.designs=null;S.opt='A';save=true}
  else if(a==='useplan'){const p=S.planRead;if(p){if(p.L)S.L=p.L;if(p.W)S.W=p.W;if(p.H)S.H=p.H;S.step=2;save=true}}
  else if(a==='delphoto'){const k=b.dataset.slot;S.photos[k]=null;if(k==='plan')S.planRead=null;else S.photoRead=null;delDoc('photos',k);save=true}
  else if(a==='delinspo'){const id=b.dataset.id;S.inspo=S.inspo.filter(i=>i.id!==id);delDoc('inspo',id)}
  else if(a==='delshop'){const id=b.dataset.id;S.shops=S.shops.filter(i=>i.id!==id);delDoc('shops',id)}
  else if(a==='delfind'){const id=b.dataset.id;S.finds=S.finds.filter(i=>i.id!==id);delDoc('finds',id)}
  if(a==='useplan'||a==='go'||a==='delphoto'||a==='delinspo'||a==='delshop'||a==='delfind'||a==='set'||a==='toggle'||a==='pick'||a==='redo'||a==='resetdesigns'){if(save)queueSave();render()}
});
document.addEventListener('submit',async e=>{
  const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();S.err='';
  const v=id=>(document.getElementById(id)||{}).value||'';
  const cleanUrl=u=>{u=u.trim();if(!u)return null;if(!/^https?:\/\//i.test(u))u='https://'+u;try{const x=new URL(u);return x.protocol.startsWith('http')?x:null}catch(_){return null}};
  try{
    if(f.dataset.form==='site'){
      const name=v('sn').trim().slice(0,80),u=cleanUrl(v('su'));
      if(!name||!u){S.err='Enter a name and a valid website address.';render();return}
      const d={name,url:u.href,host:u.hostname,note:v('sx').trim().slice(0,160),ts:Date.now()},id=newId();
      await putDoc('shops',id,d);S.shops.push({id,...d});
    }else{
      const name=v('fn').trim().slice(0,80);
      if(!name){S.err='Enter a product name.';render();return}
      const u=v('fl').trim()?cleanUrl(v('fl')):null;
      if(v('fl').trim()&&!u){S.err='That link is not a valid web address.';render();return}
      const d={name,price:num(parseFloat(v('fp')))||0,w:num(parseFloat(v('fw'))),d:num(parseFloat(v('fd'))),url:u?u.href:'',host:u?u.hostname:'',ts:Date.now()},id=newId();
      await putDoc('finds',id,d);S.finds.push({id,...d});
    }
  }catch(_){S.err='Could not save this. It will last until you close the page.'}
  render();
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.bind){const k=t.dataset.bind;S[k]=t.type==='number'?(parseFloat(t.value)||0):t.value;queueSave();render()}
  else if(t.dataset.slot&&t.files&&t.files[0]){
    const k=t.dataset.slot;S.err='';
    try{const du=await shrink(t.files[0],k==='plan'?PLAN_TRIES:PHOTO_TRIES);S.photos[k]=du;if(k==='plan')S.planRead=null;else S.photoRead=null;
      await putDoc('photos',k,{dataUrl:du,ts:Date.now()}).catch(()=>{});queueSave()}
    catch(er){S.err=er.message==='large'?'That image is too detailed to store. Try a smaller photo.':'This image type is not supported. Use a JPG or PNG.'}
    render();
  }else if(t.dataset.inspo&&t.files&&t.files.length){
    S.err='';const files=Array.from(t.files).slice(0,6);
    for(const f of files){
      if(S.inspo.length>=24){S.err='You can keep up to 24 images.';break}
      try{const du=await shrink(f,PHOTO_TRIES),id=newId(),ts=Date.now();
        await putDoc('inspo',id,{dataUrl:du,ts}).catch(()=>{});S.inspo.push({id,dataUrl:du,ts});render()}
      catch(er){S.err=er.message==='large'?'One image was too detailed to store.':'One image type is not supported. Use JPG or PNG.'}
    }
    render();
  }
});
$('back').onclick=()=>{if(S.step>0){S.step--;S.err='';render()}};
$('next').onclick=()=>{S.step=S.step===STEPS.length-1?0:S.step+1;S.err='';render()};
render();setStatus();initStore();
</script>

</body></html>
